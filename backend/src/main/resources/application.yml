spring:
  application:
    name: datacontract
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datacontract}
    username: ${DB_USER:datacontract}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    # DataStage exports of whole projects can be several hundred MB.
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_SIZE:500MB}

logging:
  level:
    # The ODCS schema defines helper keywords that the validator would log as unknown at startup.
    com.networknt.schema.UnknownKeywordFactory: ERROR

app:
  # Passwords use Spring's {id}hash format, e.g. {bcrypt}$2a$...
  security:
    users: []
  catalog:
    refresh-interval: PT1H
    datahub:
      url: ${DATAHUB_URL:}
      token: ${DATAHUB_TOKEN:}
  # Repository with the DDL files of the target tables; without a URL the comparison is skipped.
  ddl:
    refresh-interval: PT15M
    workdir: ${DDL_WORKDIR:./data/ddl}
    remote-url: ${DDL_REMOTE_URL:}
    branch: ${DDL_BRANCH:main}
    path: ${DDL_PATH:}
    username: ${DDL_USERNAME:}
    token: ${DDL_TOKEN:}
  # Address of this application, used for links from Jira and Confluence back to it.
  public-url: ${APP_PUBLIC_URL:}
  # Jira and Confluence Cloud use the same site and an API token with e-mail address. Without a URL or space key the
  # respective integration stays off.
  atlassian:
    base-url: ${ATLASSIAN_URL:}
    email: ${ATLASSIAN_EMAIL:}
    api-token: ${ATLASSIAN_API_TOKEN:}
    confluence-space-key: ${CONFLUENCE_SPACE_KEY:}
    confluence-parent-page-id: ${CONFLUENCE_PARENT_PAGE_ID:}
    refresh-interval: PT15M
    task-interval: PT30S
  git:
    workdir: ${GIT_WORKDIR:./data/artifacts}
    remote-url: ${GIT_REMOTE_URL:}
    branch: ${GIT_BRANCH:main}
    username: ${GIT_USERNAME:}
    token: ${GIT_TOKEN:}
    bot-name: ${GIT_BOT_NAME:DataContract Bot}
    bot-email: ${GIT_BOT_EMAIL:datacontract-bot@localhost}
