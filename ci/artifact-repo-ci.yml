# Vorlage für das Artefakt-Repo, in das die Anwendung Contracts und Datenprodukte veröffentlicht.
# Dort ablegen als .github/workflows/contracts.yml.
name: Data Contracts

on:
  push:
    paths: ["contracts/**", "products/**"]
  pull_request:
    paths: ["contracts/**", "products/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "datacontract-cli==1.2.9" "check-jsonschema==0.39.0"
      - name: Contracts gegen das ODCS-Schema prüfen
        run: |
          status=0
          while IFS= read -r contract; do
            echo "::group::$contract"
            datacontract lint "$contract" || status=1
            echo "::endgroup::"
          done < <(find contracts -name odcs.yaml)
          exit $status
      - name: Datenprodukte gegen das ODPS-Schema prüfen
        run: |
          products=$(find products -name odps.yaml 2>/dev/null)
          if [ -n "$products" ]; then
            check-jsonschema \
              --schemafile https://raw.githubusercontent.com/bitol-io/open-data-product-standard/main/schema/odps-json-schema-v1.1.0.json \
              $products
          fi
