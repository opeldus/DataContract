services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: datacontract
      POSTGRES_USER: datacontract
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss gesetzt sein}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
